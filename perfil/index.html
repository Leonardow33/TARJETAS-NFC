<style>
  :root {

  html, body { margin: 0; }

  .card {

    box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
    text-align: center; position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .avatar {
    width: 104px; height: 104px; margin: 0 auto 18px; border-radius: 50%;
    display: grid; place-items: center; position: relative;
    background: radial-gradient(circle at 30% 25%, #1d2433, #0e121a);
    box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--gold), 0 14px 30px rgba(0,0,0,.5);
    font-size: 2.3rem; font-weight: 700; letter-spacing: .02em;
    background-clip: padding-box;
  }
  .avatar span {
    background: linear-gradient(135deg, var(--gold-2), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 1.62rem; line-height: 1.2; margin: 0 0 6px; font-weight: 700; letter-spacing: -.01em; }
  .role { margin: 0; color: var(--gold-2); font-weight: 600; font-size: .98rem; }
  .tag { margin: 10px auto 0; color: var(--muted); font-size: .9rem; line-height: 1.5; max-width: 300px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }
  .btn {
    display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink);
    background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 14px; font-weight: 600; font-size: .95rem; text-align: left;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
    animation: rise .6s ease both;
  }
  .btn:hover, .btn:focus-visible { border-color: var(--gold); background: rgba(217,180,91,.07); outline: none; }
  .btn:active { transform: scale(.98); }
  .btn.wide { grid-column: 1 / -1; }
  .btn small { display: block; color: var(--muted); font-weight: 500; font-size: .78rem; margin-top: 2px; }
  .ico { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; }
  .ico svg { width: 22px; height: 22px; }
  .i-wa { background: #25d366; color: #fff; }
  .i-ph { background: #2d3a52; color: #fff; }
  .i-li { background: #0a66c2; color: #fff; }
  .i-ig { background: radial-gradient(circle at 30% 110%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 90%); color: #fff; }
  .i-ct { background: linear-gradient(135deg, var(--gold-2), var(--gold)); color: #1a1406; }
  .btn:nth-child(1) { animation-delay: .08s } .btn:nth-child(2) { animation-delay: .14s }
  .btn:nth-child(3) { animation-delay: .2s } .btn:nth-child(4) { animation-delay: .26s }
  .btn:nth-child(5) { animation-delay: .32s }

  .save {

  }

  .save .ico { background: rgba(26,20,6,.12); color: #1a1406; width: 34px; height: 34px; }
  .foot { text-align: center; color: #5f6a7d; font-size: .75rem; margin-top: 18px; }
  .foot b { color: #8a94a7; font-weight: 600; }
  @media (max-width: 340px) { .actions { grid-template-columns: 1fr; } }
