<style>
  /* EDITAR: colores de la marca */
  :root {

  /* ---- Portada ---- */

  .demo-pill {

  }
  .logo {
    width: 96px; height: 96px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 25%, #fff, #f3ead8); color: var(--navy);
    box-shadow: 0 0 0 4px rgba(255,255,255,.18), 0 14px 30px rgba(0,0,0,.35);
    position: relative; z-index: 1;

  .logo svg { width: 58px; height: 58px; }
  .hero h1 { position: relative; z-index: 1; margin: 0; font-size: 2.1rem; line-height: 1.1; letter-spacing: -.01em; }

  .status {

  .hero-actions { position: relative; z-index: 1; display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .hbtn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: .95rem;

  /* ---- Barra de categorías ---- */

    position: sticky; top: 0; z-index: 20; background: rgba(251,246,236,.94);

    border-bottom: 1px solid var(--line); padding: 10px 0 8px;

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  .search {
    display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px;
  }
  .search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; padding: 10px 0; color: var(--ink); min-width: 0; }

  .chip {
    flex: none; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 99px;

  .chip.f.on { background: var(--accent); border-color: var(--accent); }
  .chip.sep { border: 0; background: none; padding: 7px 2px; color: var(--line); cursor: default; }

  @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }
  .dish {

    width: 104px; height: 104px; flex: none; border-radius: 14px; display: grid; place-items: center;

  .photo img { width: 100%; height: 100%; object-fit: cover; }

  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag { font-size: .72rem; font-weight: 700; border-radius: 99px; padding: 3px 8px; }
  .tag.top { background: #fff1d6; color: #9a5b00; }
  .tag.hot { background: #ffe1d6; color: #b33a00; }
  .price { margin-top: auto; padding-top: 6px; display: flex; align-items: baseline; justify-content: space-between; }
  .price b { font-size: 1.12rem; color: var(--navy); }
  .price b small { font-size: .75rem; font-weight: 700; margin-right: 2px; }
  .dish.star { border-color: #f6c56b; box-shadow: 0 8px 22px rgba(242,154,29,.18); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; display: none; }

  /* aparición suave */
  .rv { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
  .rv.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }

  /* ---- Información ---- */
  .infobox { margin-top: 30px; background: var(--navy); color: #fff; border-radius: 22px; padding: 22px 18px; position: relative; overflow: hidden; }
  .infobox h2 { margin: 0 0 12px; font-size: 1.3rem; }
  .infobox .cols { display: grid; gap: 16px; }
  @media (min-width: 620px) { .infobox .cols { grid-template-columns: 1fr 1fr; } }
  .hours { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .hours td { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  .hours td:last-child { text-align: right; color: #dbe6f3; }
  .hours tr.today td { color: var(--accent-2); font-weight: 700; }
  .infobox p { margin: 0 0 12px; color: #dbe6f3; font-size: .92rem; }
  .ibtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .ibtn { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 12px; padding: 9px 12px; font-weight: 600; font-size: .88rem; }
  .ibtn svg { width: 16px; height: 16px; }
  footer { text-align: center; color: var(--muted); font-size: .78rem; padding: 26px 16px calc(96px + env(safe-area-inset-bottom)); }
  footer a { color: var(--sea); font-weight: 600; }

  /* ---- Botones flotantes ---- */
  .wa {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30;
    display: flex; align-items: center; gap: 8px; text-decoration: none; color: #fff; font-weight: 700;
    background: #25d366; border-radius: 99px; padding: 13px 18px 13px 14px; box-shadow: 0 12px 26px rgba(37,211,102,.45);

  .wa svg { width: 24px; height: 24px; }
  .top {
    position: fixed; left: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 30; width: 46px; height: 46px; border-radius: 50%;
    border: 0; background: var(--navy); color: #fff; display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 10px 22px rgba(11,37,69,.35); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .25s;
  }
  .top.show { opacity: 1; transform: none; pointer-events: auto; }
  .top svg { width: 20px; height: 20px; }
</style>

      { n: "Cerveza", d: "Botella de 620 ml bien helada.", p: 10, foto: "🍺" }
    ]},
    { id: "postres", nombre: "Postres", icono: "🍮", color: ["#ffe0ea", "#f7a8c0"], platos: [
      { n: "Suspiro a la limeña", d: "Manjar blanco con merengue al oporto.", p: 12, foto: "🍮" },
      { n: "Mazamorra morada", d: "Con frutas secas y canela.", p: 10, foto: "🍧" }
    ]}
  ]
};
</script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function norm(t) { t = String(t).toLowerCase(); return t.normalize ? t.normalize("NFD").replace(/[̀-ͯ]/g, "") : t; }
  function money(n) { return "<small>S/ </small>" + (n % 1 ? n.toFixed(2) : n); }
  var wa = "https://wa.me/" + CARTA.whatsapp + "?text=" + encodeURIComponent(CARTA.mensaje);

  // portada e información
  $("h-name").innerHTML = CARTA.nombre;
  $("h-lema").textContent = CARTA.lema;
  $("wa").href = wa;
  $("h-wa").href = "https://wa.me/" + CARTA.whatsapp + "?text=" + encodeURIComponent("Hola, quiero reservar una mesa");
  $("addr").textContent = CARTA.direccion;
  $("maps").href = CARTA.mapa; $("call").href = "tel:" + CARTA.telefono; $("ig").href = CARTA.instagram;

  // horario y estado (abierto / cerrado) según la hora del celular
  var now = new Date(), dow = now.getDay(), idx = (dow + 6) % 7, h = CARTA.horario[idx];
  function mins(s) { var p = s.split(":"); return +p[0] * 60 + +p[1]; }
  var cur = now.getHours() * 60 + now.getMinutes(), open = h && cur >= mins(h.abre) && cur < mins(h.cierra);
  $("h-status").classList.toggle("closed", !open);
  $("h-status").querySelector("span").textContent = open ? "Abierto ahora · hasta las " + h.cierra : "Cerrado ahora · hoy de " + h.abre + " a " + h.cierra;
  $("hours").innerHTML = CARTA.horario.map(function (x, i) {
    return '<tr' + (i === idx ? ' class="today"' : "") + "><td>" + esc(x.dia) + "</td><td>" + esc(x.abre) + " – " + esc(x.cierra) + "</td></tr>";
  }).join("");

  // carta
  $("menu").innerHTML = CARTA.categorias.map(function (c) {
    return '<section class="cat" id="c-' + c.id + '"><h2 class="serif"><span class="ce">' + c.icono + "</span>" + esc(c.nombre) + "<small>" + c.platos.length + " platos</small></h2><div class=\"grid\">" +
      c.platos.map(function (p) {
        var tags = p.tags || [], img = /\.(jpe?g|png|webp)$/i.test(p.foto || "") ? '<img src="' + esc(p.foto) + '" alt="" loading="lazy">' : "<span>" + (p.foto || c.icono) + "</span>";
        return '<article class="dish rv' + (tags.indexOf("top") >= 0 ? " star" : "") + '" data-k="' + esc(norm(p.n + " " + p.d)) + '" data-t="' + tags.join(" ") + '">' +
          '<div class="photo" style="background:linear-gradient(135deg,' + c.color[0] + "," + c.color[1] + ')">' + img + "</div>" +
          '<div class="info"><h3>' + esc(p.n) + "</h3><p>" + esc(p.d) + "</p>" +
          (tags.length ? '<div class="tags">' + (tags.indexOf("top") >= 0 ? '<span class="tag top">⭐ El más pedido</span>' : "") + (tags.indexOf("hot") >= 0 ? '<span class="tag hot">🌶️ Picante</span>' : "") + "</div>" : "") +
          '<div class="price"><b>' + money(p.p) + "</b></div></div></article>";
      }).join("") + "</div></section>";
  }).join("");

  // chips: categorías + filtros
  $("chips").innerHTML = CARTA.categorias.map(function (c, i) {
    return '<button class="chip' + (i ? "" : " on") + '" data-c="' + c.id + '">' + c.icono + " " + esc(c.nombre) + "</button>";
  }).join("") + '<span class="chip sep">|</span><button class="chip f" data-f="top">⭐ Más pedidos</button><button class="chip f" data-f="hot">🌶️ Picantes</button>';

  var filtro = "";
  function apply() {
    var q = norm($("q").value.trim()), any = false;
    [].forEach.call(document.querySelectorAll(".cat"), function (sec) {
      var vis = 0;
      [].forEach.call(sec.querySelectorAll(".dish"), function (d) {
        var ok = (!q || d.dataset.k.indexOf(q) >= 0) && (!filtro || d.dataset.t.indexOf(filtro) >= 0);
        d.style.display = ok ? "" : "none"; if (ok) { vis++; d.classList.add("in"); }
      });
      sec.style.display = vis ? "" : "none"; if (vis) any = true;
    });
    $("empty").style.display = any ? "none" : "block";
  }
  $("q").addEventListener("input", apply);
  $("chips").addEventListener("click", function (ev) {
    var b = ev.target.closest(".chip"); if (!b || b.classList.contains("sep")) return;
    if (b.dataset.f) {
      filtro = filtro === b.dataset.f ? "" : b.dataset.f;
      [].forEach.call(document.querySelectorAll(".chip.f"), function (x) { x.classList.toggle("on", x.dataset.f === filtro); });
      apply(); $("carta").scrollIntoView(); return;
    }
    var sec = $("c-" + b.dataset.c); if (sec && sec.style.display !== "none") sec.scrollIntoView();
  });

  // categoría activa al hacer scroll + botón volver arriba
  var chips = [].slice.call(document.querySelectorAll(".chip[data-c]")), lastAct = null;
  function onScroll() {
    var y = window.scrollY + 130, act = chips[0];
    chips.forEach(function (c) { var s = $("c-" + c.dataset.c); if (s.style.display !== "none" && s.offsetTop <= y) act = c; });
    chips.forEach(function (c) { c.classList.toggle("on", c === act); });
    if (act && act !== lastAct) {   // centra el chip activo sin mover la página
      lastAct = act; var box = $("chips");
      box.scrollTo({ left: act.offsetLeft - (box.clientWidth - act.offsetWidth) / 2, behavior: "smooth" });
    }
    $("top").classList.toggle("show", window.scrollY > 600);
  }
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();
  $("top").addEventListener("click", function () { window.scrollTo(0, 0); });

  // aparición suave
  var items = document.querySelectorAll(".rv");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, { rootMargin: "0px 0px -8% 0px" });
    [].forEach.call(items, function (el) { io.observe(el); });
  } else [].forEach.call(items, function (el) { el.classList.add("in"); });
})();
</script>
</body>
</html>
